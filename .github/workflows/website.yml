name: Website

# Rebuilds merathilisui.com whenever the in-game changelog changes on development.
# The site reads Core/Changelog/*.lua at build time, so this covers new entries,
# the release date set in the release commit and the rollover in "prep changelogs".

on:
    push:
        branches:
            - development
        paths:
            - "ElvUI_MerathilisUI/Core/Changelog/**"
    workflow_dispatch:

permissions: {}

jobs:
    rebuild:
        name: Trigger Cloudflare build
        runs-on: ubuntu-latest

        steps:
            - name: Call deploy hook
              env:
                  DEPLOY_HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
              run: |
                  if [ -z "$DEPLOY_HOOK" ]; then
                      echo "::warning::WEBSITE_DEPLOY_HOOK secret is not set, skipping website rebuild"
                      exit 0
                  fi
                  curl --fail-with-body --silent --show-error -X POST "$DEPLOY_HOOK"
