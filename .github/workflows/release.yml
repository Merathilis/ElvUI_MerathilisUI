name: Release

on:
    push:
        tags:
            - "**"

permissions:
    contents: write

jobs:
    release:
        name: Build & Release
        runs-on: ubuntu-latest

        env:
            # CurseForge
            CF_API_KEY: ${{ secrets.CF_API_KEY }}

            # Wago
            WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

            # GitHub
            # IMPORTANT: The packager expects exactly “GITHUB_OAUTH,” not GITHUB_API_TOKEN,
            # otherwise, the upload to GitHub Releases won't work.
            GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

            # Project URLs - used for Discord notification
            CF_URL: https://www.curseforge.com/wow/addons/merathilis-ui
            WAGO_URL: https://addons.wago.io/addons/elvui-merathilisui

        steps:
            # ---------------------------------------------------------
            # Checkout repository
            # ---------------------------------------------------------
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  submodules: recursive

            # ---------------------------------------------------------
            # Make sure all tags are available
            # ---------------------------------------------------------
            - name: Fetch Tags
              run: git fetch --tags --force

            # ---------------------------------------------------------
            # Set release version
            # ---------------------------------------------------------
            - name: Set Release Version
              shell: bash
              run: |
                  VERSION="${GITHUB_REF#refs/tags/}"
                  echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
                  echo "Releasing version: ${VERSION}"

            # ---------------------------------------------------------
            # Package addon and upload to:
            #   - CurseForge
            #   - Wago
            #   - GitHub
            # ---------------------------------------------------------
            - name: BigWigs Packager
              uses: BigWigsMods/packager@v2
              with:
                  args: -n "{package-name}-{project-version}"

            # ---------------------------------------------------------
            # Sanity check: Aborts the job immediately with a clear message
            # if .release/*.zip is missing or empty for any reason,
            # rather than failing with “no files found”
            # during the upload artifact step.
            # ---------------------------------------------------------
            - name: Verify release artifact exists
              shell: bash
              run: |
                  echo "Contents of .release/:"
                  ls -la .release/ || true
                  shopt -s nullglob
                  files=(.release/*.zip)
                  if [ ${#files[@]} -eq 0 ]; then
                      echo "::error::No ZIP file found in .release/!"
                      exit 1
                  fi
                  echo "Found ZIP(s): ${files[*]}"

            # ---------------------------------------------------------
            # Upload generated ZIP as GitHub Actions artifact
            #
            # include-hidden-files: true is mandatory because ".release"
            # is a "hidden" folder (starts with a dot). Since the
            # breaking change in actions/upload-artifact (Sept. 2024),
            # files in such folders are otherwise silently skipped
            # ("No files were found...").
            # ---------------------------------------------------------
            - name: Upload Artifact
              uses: actions/upload-artifact@v6
              with:
                  name: ElvUI_MerathilisUI-${{ env.RELEASE_VERSION }}
                  path: .release/*.zip
                  if-no-files-found: error
                  retention-days: 30
                  include-hidden-files: true

            # ---------------------------------------------------------
            # Send release notification to Discord
            # ---------------------------------------------------------
            - name: Send Status to Discord
              if: success()
              uses: repooc/djs-actions@my_changes
              with:
                  id: ${{ secrets.DISCORD_WEBHOOK_ID }}
                  token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}

                  title: "New *${{ github.event.repository.name }}* Version Released!"

                  description: |
                      [${{ github.event.sender.login }}](${{ github.event.sender.html_url }}) has released a new version of ${{ github.event.repository.name }}!

                      If you use an addon client that supports Wago Addons or CurseForge, it is recommended to use one of those clients to install or update the addon.

                      You can also download the addon manually from the GitHub release.

                  fields: >-
                      [
                        {
                          "name": "Released By:",
                          "value": "[${{ github.event.sender.login }}](${{ github.event.sender.html_url }})",
                          "inline": true
                        },
                        {
                          "name": "Issue Tracker:",
                          "value": "[${{ github.event.repository.name }}](${{ github.event.repository.html_url }}/issues)",
                          "inline": true
                        },
                        {
                          "name": "Version",
                          "value": "${{ env.RELEASE_VERSION }}",
                          "inline": true
                        },
                        {
                          "name": "Wago Addons",
                          "value": "[Click Here](${{ env.WAGO_URL }})",
                          "inline": true
                        },
                        {
                          "name": "CurseForge",
                          "value": "[Click Here](${{ env.CF_URL }})",
                          "inline": true
                        }
                      ]

                  footer: "Addon by Merathilis"
                  timestamp: true
