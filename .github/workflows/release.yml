name: Release

on:
    push:
        tags:
            - "**"

permissions:
    contents: write

jobs:
    release:
        name: Build & Release
        runs-on: ubuntu-latest

        env:
            # CurseForge
            CF_API_KEY: ${{ secrets.CF_API_KEY }}

            # Wago
            WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

            # WoWInterface (addon id comes from "## X-WoWI-ID" in the TOC)
            # WoWI has no alpha/beta channel, so test tags would replace the
            # stable download there. Only hand the token to release tags.
            WOWI_API_TOKEN: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && secrets.WOWI_API_TOKEN || '' }}

            # GitHub
            # IMPORTANT: The packager expects exactly “GITHUB_OAUTH,” not GITHUB_API_TOKEN,
            # otherwise, the upload to GitHub Releases won't work.
            GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

            # Project URLs - used for the Discord announcement
            CF_URL: https://www.curseforge.com/wow/addons/merathilis-ui
            WAGO_URL: https://addons.wago.io/addons/elvui-merathilisui
            WOWI_URL: https://www.wowinterface.com/downloads/info24117

        steps:
            # ---------------------------------------------------------
            # Checkout repository
            # ---------------------------------------------------------
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            # ---------------------------------------------------------
            # Make sure all tags are available
            # ---------------------------------------------------------
            - name: Fetch Tags
              run: git fetch --tags --force

            # ---------------------------------------------------------
            # Set release version
            # ---------------------------------------------------------
            - name: Set Release Version
              shell: bash
              run: |
                  VERSION="${GITHUB_REF#refs/tags/}"
                  echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
                  echo "Releasing version: ${VERSION}"

            # ---------------------------------------------------------
            # Package addon and upload to:
            #   - CurseForge
            #   - Wago
            #   - WoWInterface
            #   - GitHub
            # ---------------------------------------------------------
            - name: BigWigs Packager
              uses: BigWigsMods/packager@v2
              with:
                  args: -n "{package-name}-{project-version}"

            # ---------------------------------------------------------
            # Sanity check: Aborts the job immediately with a clear message
            # if .release/*.zip is missing or empty for any reason,
            # rather than failing with “no files found”
            # during the upload artifact step.
            # ---------------------------------------------------------
            - name: Verify release artifact exists
              shell: bash
              run: |
                  echo "Contents of .release/:"
                  ls -la .release/ || true
                  shopt -s nullglob
                  files=(.release/*.zip)
                  if [ ${#files[@]} -eq 0 ]; then
                      echo "::error::No ZIP file found in .release/!"
                      exit 1
                  fi
                  echo "Found ZIP(s): ${files[*]}"

            # ---------------------------------------------------------
            # Upload generated ZIP as GitHub Actions artifact
            #
            # include-hidden-files: true is mandatory because ".release"
            # is a "hidden" folder (starts with a dot). Since the
            # breaking change in actions/upload-artifact (Sept. 2024),
            # files in such folders are otherwise silently skipped
            # ("No files were found...").
            # ---------------------------------------------------------
            - name: Upload Artifact
              uses: actions/upload-artifact@v6
              with:
                  name: ElvUI_MerathilisUI-${{ env.RELEASE_VERSION }}
                  path: .release/*.zip
                  if-no-files-found: error
                  retention-days: 30
                  include-hidden-files: true

            # ---------------------------------------------------------
            # Send the release notification through Repooc's Discord
            # webhook (posts into the #release channel)
            # ---------------------------------------------------------
            - name: Send Status to Discord
              if: success()
              continue-on-error: true
              uses: repooc/djs-actions@my_changes
              with:
                  id: ${{ secrets.DISCORD_WEBHOOK_ID }}
                  token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}

                  title: "New *${{ github.event.repository.name }}* Version Released!"

                  description: |
                      [${{ github.event.sender.login }}](${{ github.event.sender.html_url }}) has released a new version of ${{ github.event.repository.name }}!

                      If you use an addon client that supports Wago Addons or CurseForge, it is recommended to use one of those clients to install or update the addon.

                      You can also download the addon manually from the GitHub release.

                  fields: >-
                      [
                        {
                          "name": "Released By:",
                          "value": "[${{ github.event.sender.login }}](${{ github.event.sender.html_url }})",
                          "inline": true
                        },
                        {
                          "name": "Issue Tracker:",
                          "value": "[${{ github.event.repository.name }}](${{ github.event.repository.html_url }}/issues)",
                          "inline": true
                        },
                        {
                          "name": "Version",
                          "value": "${{ env.RELEASE_VERSION }}",
                          "inline": true
                        },
                        {
                          "name": "Wago Addons",
                          "value": "[Click Here](${{ env.WAGO_URL }})",
                          "inline": true
                        },
                        {
                          "name": "CurseForge",
                          "value": "[Click Here](${{ env.CF_URL }})",
                          "inline": true
                        },
                        {
                          "name": "WoWInterface",
                          "value": "[Click Here](${{ env.WOWI_URL }})",
                          "inline": true
                        }
                      ]

                  footer: "Addon by Merathilis"
                  timestamp: true

            # ---------------------------------------------------------
            # Post the release announcement with the changelog via the
            # "MerathilisUI Release" bot and publish it to followers.
            # The channel can be changed with the DISCORD_CHANNEL_ID
            # repository variable (Settings > Secrets and variables).
            # ---------------------------------------------------------
            - name: Announce on Discord
              if: success() && !contains(env.RELEASE_VERSION, 'alpha') && !contains(env.RELEASE_VERSION, 'beta')
              continue-on-error: true
              shell: bash
              env:
                  BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
                  CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID || '907240345346142219' }}
                  RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
                  LOGO_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/.github/media/logo.png
                  WEBSITE_URL: https://merathilisui.com
              run: |
                  summary() {
                      echo "$1"
                      echo "$1" >> "$GITHUB_STEP_SUMMARY"
                  }

                  if [ -z "$BOT_TOKEN" ]; then
                      echo "::warning::DISCORD_BOT_TOKEN secret is not set, skipping Discord announcement"
                      exit 0
                  fi

                  API="https://discord.com/api/v10/channels/${CHANNEL_ID}/messages"
                  UA="DiscordBot (${{ github.server_url }}/${{ github.repository }}, 1.0)"

                  # Group the "-   [Fix]: Module: text" lines by category (New first) and bold the module
                  awk '
                      { sub(/\r$/, "") }
                      /^-[[:space:]]+\[(Fix|New|Improvement)\]:/ {
                          cat = $0
                          sub(/^-[[:space:]]+\[/, "", cat)
                          sub(/\].*/, "", cat)
                          text = $0
                          sub(/^-[[:space:]]+\[[^]]+\]:[[:space:]]*/, "", text)
                          if (match(text, /^[^:]+: /)) {
                              text = "**" substr(text, 1, RLENGTH - 2) ":** " substr(text, RLENGTH + 1)
                          }
                          lines[cat] = lines[cat] "• " text "\n"
                      }
                      END {
                          if (lines["New"] != "") printf "**✨ New**\n%s\n", lines["New"]
                          if (lines["Improvement"] != "") printf "**👌 Improvements**\n%s\n", lines["Improvement"]
                          if (lines["Fix"] != "") printf "**🐛 Fixes**\n%s", lines["Fix"]
                      }
                  ' CHANGELOG.md > DISCORD_NOTES.md

                  # Counts per category, so a cut off list still shows the size of the release
                  NEW=$(grep -c '^-[[:space:]]*\[New\]' CHANGELOG.md || true)
                  IMPROVEMENTS=$(grep -c '^-[[:space:]]*\[Improvement\]' CHANGELOG.md || true)
                  FIXES=$(grep -c '^-[[:space:]]*\[Fix\]' CHANGELOG.md || true)
                  COUNTS="✨ ${NEW} New · 👌 ${IMPROVEMENTS} Improvements · 🐛 ${FIXES} Fixes"

                  # Embed descriptions are capped at 4096 chars, cut at a line boundary
                  if [ "$(wc -m < DISCORD_NOTES.md)" -gt 3800 ]; then
                      awk '{ n += length($0) + 1; if (n > 3600) exit; print }' DISCORD_NOTES.md > DISCORD_NOTES.tmp
                      printf '\n…\n[Full changelog](%s)\n' "$RELEASE_URL" >> DISCORD_NOTES.tmp
                      mv DISCORD_NOTES.tmp DISCORD_NOTES.md
                  fi

                  jq -n \
                      --arg version "$RELEASE_VERSION" \
                      --arg url "$RELEASE_URL" \
                      --arg logo "$LOGO_URL" \
                      --rawfile notes DISCORD_NOTES.md \
                      --arg counts "$COUNTS" \
                      --arg links "[CurseForge](${CF_URL}) · [Wago](${WAGO_URL}) · [WoWInterface](${WOWI_URL}) · [GitHub](${RELEASE_URL})" \
                      --arg website "$WEBSITE_URL" \
                      '{
                          content: ("**Version " + $version + " is out, go check it out!**"),
                          allowed_mentions: { parse: [] },
                          embeds: [{
                              title: ("MerathilisUI " + $version),
                              url: $url,
                              description: $notes,
                              color: 16088064,
                              thumbnail: { url: $logo },
                              fields: [
                                  { name: "📋 Changes", value: $counts, inline: false },
                                  { name: "📥 Download", value: $links, inline: false },
                                  { name: "🌐 Website", value: ("[merathilisui.com](" + $website + ")"), inline: true },
                                  { name: "🏷️ Version", value: $version, inline: true }
                              ],
                              footer: { text: "Addon by Merathilis", icon_url: $logo },
                              timestamp: (now | todate)
                          }]
                      }' > DISCORD_PAYLOAD.json

                  HTTP=$(curl -sS -o DISCORD_RESPONSE.json -w '%{http_code}' \
                      -H "Authorization: Bot ${BOT_TOKEN}" \
                      -H "User-Agent: ${UA}" \
                      -H "Content-Type: application/json" \
                      --data-binary @DISCORD_PAYLOAD.json "$API") || {
                      echo "::warning::Could not reach the Discord API"
                      exit 0
                  }

                  if [ "$HTTP" -ge 300 ]; then
                      echo "::warning::Discord rejected the announcement (HTTP ${HTTP})"
                      cat DISCORD_RESPONSE.json
                      exit 0
                  fi

                  MESSAGE_ID=$(jq -r '.id' DISCORD_RESPONSE.json)
                  summary "Discord: announcement posted in channel ${CHANNEL_ID} (message ${MESSAGE_ID})"

                  # Publish to every server following the announcement channel
                  HTTP=$(curl -sS -o DISCORD_RESPONSE.json -w '%{http_code}' -X POST \
                      -H "Authorization: Bot ${BOT_TOKEN}" \
                      -H "User-Agent: ${UA}" \
                      "${API}/${MESSAGE_ID}/crosspost") || HTTP=000

                  if [ "$HTTP" -ge 300 ] || [ "$HTTP" = "000" ]; then
                      echo "::warning::Could not publish the announcement to followers (HTTP ${HTTP})"
                      cat DISCORD_RESPONSE.json 2>/dev/null
                  else
                      summary "Discord: announcement published to followers"
                  fi
